<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplikasi BBM Finder</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }

        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .checkbox-group label {
            font-weight: normal;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-warning {
            background-color: #f1c40f;
            color: black;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        .badge-spbu {
            background-color: #e74c3c;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-eceran {
            background-color: #f39c12;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Sistem Manajemen BBM Finder</h1>

<!-- CARD 1: FORMULIR INPUT -->
<div class="card">
    <h2 id="formTitle">Tambah Lokasi Baru</h2>
    <form id="lokasiForm">
        <input type="hidden" id="lokasiId">

        <div class="form-group">
            <label for="nama">Nama Lokasi / SPBU</label>
            <input type="text" id="nama" required placeholder="Contoh: SPBU Pertamina 34.40257">
        </div>

        <div class="form-group">
            <label for="kategori">Kategori</label>
            <select id="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                <option value="spbu">SPBU</option>
                <option value="eceran">Eceran</option>
            </select>
        </div>

        <div class="form-group">
            <label for="alamat">Alamat Lengkap</label>
            <textarea id="alamat" rows="2" placeholder="Masukkan alamat lokasi..."></textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex:1;">
                <label for="lintang">Lintang (Latitude)</label>
                <input type="number" step="any" id="lintang" required placeholder="Contoh: -6.941683">
            </div>
            <div class="form-group" style="flex:1;">
                <label for="bujur">Bujur (Longitude)</label>
                <input type="number" step="any" id="bujur" required placeholder="Contoh: 107.642500">
            </div>
        </div>

        <div class="form-group">
            <label>Tipe Bensin yang Tersedia</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="tipe_bensin" value="Pertalite"> Pertalite</label>
                <label><input type="checkbox" name="tipe_bensin" value="Pertamax"> Pertamax</label>
                <label><input type="checkbox" name="tipe_bensin" value="Pertamax Turbo"> Pertamax Turbo</label>
                <label><input type="checkbox" name="tipe_bensin" value="Solar"> Solar</label>
            </div>
        </div>

        <div class="form-group">
            <label for="jam_operasi">Jam Operasi</label>
            <input type="text" id="jam_operasi" placeholder="Contoh: 24 Jam atau 06.00 - 21.00">
        </div>

        <button type="submit" id="btnSubmit">Simpan Data</button>
        <button type="button" id="btnBatal" style="display:none; background-color: #95a5a6;">Batal</button>
    </form>
</div>

<!-- CARD 2: TABEL DATA LOKASI -->
<div class="card">
    <h2>Daftar Lokasi BBM</h2>

    <div class="search-bar">
        <input type="text" id="inputCari" placeholder="Cari berdasarkan nama..." style="flex:1;">
        <button onClick="cariLokasi()">Cari</button>
        <button onClick="resetPencarian()" style="background-color: #2ecc71;">Reset</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Kategori</th>
            <th>Koordinat</th>
            <th>BBM</th>
            <th>Jam Operasi</th>
            <th>Verifikasi</th>
            <th>Aksi</th>
        </tr>
        </thead>
        <tbody id="tabelLokasi">
        <!-- Data lokasi ditampilkan di sini -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:5000/api/lokasi';
    const form = document.getElementById('lokasiForm');
    const tabelBody = document.getElementById('tabelLokasi');

    async function ambilSemuaLokasi() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            renderTabel(data);
        } catch (error) {
            console.error('Gagal mengambil data:', error);
        }
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();

        const id = document.getElementById('lokasiId').value;

        // Ambil array checkbox tipe bensin yang dipilih
        const tipeBensinChecked = Array.from(document.querySelectorAll('input[name="tipe_bensin"]:checked'))
            .map(cb => cb.value);

        if (tipeBensinChecked.length === 0) {
            alert('Pilih minimal 1 tipe bensin!');
            return;
        }

        const payload = {
            nama: document.getElementById('nama').value,
            kategori: document.getElementById('kategori').value,
            alamat: document.getElementById('alamat').value,
            lintang: parseFloat(document.getElementById('lintang').value),
            bujur: parseFloat(document.getElementById('bujur').value),
            tipe_bensin: tipeBensinChecked,
            jam_operasi: document.getElementById('jam_operasi').value
        };

        try {
            let response;
            if (id) {
                response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            const result = await response.json();

            if (response.ok) {
                alert(result.message);
                resetForm();
                ambilSemuaLokasi();
            } else {
                alert(`Error: ${result.message}`);
            }
        } catch (error) {
            alert('Terjadi kesalahan pada server');
        }
    });

    async function hapusLokasi(id) {
        if (confirm('Apakah Anda yakin ingin menghapus lokasi ini?')) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    ambilSemuaLokasi();
                } else {
                    alert(`Error: ${result.message}`);
                }
            } catch (error) {
                console.error('Gagal menghapus:', error);
            }
        }
    }

    async function cariLokasi() {
        const namaDicari = document.getElementById('inputCari').value;
        if (!namaDicari) return ambilSemuaLokasi();

        try {
            const response = await fetch(`${API_URL}/cari/${namaDicari}`);
            if (response.ok) {
                const data = await response.json();
                renderTabel(data);
            } else {
                tabelBody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Lokasi tidak ditemukan</td></tr>';
            }
        } catch (error) {
            console.error('Gagal mencari data:', error);
        }
    }

    function resetPencarian() {
        document.getElementById('inputCari').value = '';
        ambilSemuaLokasi();
    }

    function renderTabel(data) {
        tabelBody.innerHTML = '';
        if (data.length === 0) {
            tabelBody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Tidak ada data</td></tr>';
            return;
        }

        data.forEach(lokasi => {
            // Parsing tipe bensin dari array / string JSON
            let bbmList = lokasi.tipe_bensin;
            if (typeof bbmList === 'string') {
                try { bbmList = JSON.parse(bbmList).join(', '); }
                catch(e) { bbmList = lokasi.tipe_bensin; }
            } else if (Array.isArray(bbmList)) {
                bbmList = bbmList.join(', ');
            }

            const badgeClass = lokasi.kategori === 'spbu' ? 'badge-spbu' : 'badge-eceran';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${lokasi.id}</td>
                <td><b>${lokasi.nama}</b></td>
                <td><span class="${badgeClass}">${lokasi.kategori.toUpperCase()}</span></td>
                <td>${lokasi.lintang}, ${lokasi.bujur}</td>
                <td>${bbmList}</td>
                <td>${lokasi.jam_operasi || '24 Jam'}</td>
                <td>${lokasi.verifikasi_terakhir || '-'}</td>
                <td>
                    <button class="btn-warning" onClick='siapkanEdit(${JSON.stringify(lokasi)})'>Edit</button>
                    <button class="btn-danger" onClick="hapusLokasi(${lokasi.id})">Hapus</button>
                </td>
            `;
            tabelBody.appendChild(tr);
        });
    }

    function siapkanEdit(lokasi) {
        document.getElementById('lokasiId').value = lokasi.id;
        document.getElementById('nama').value = lokasi.nama;
        document.getElementById('kategori').value = lokasi.kategori;
        document.getElementById('alamat').value = lokasi.alamat || '';
        document.getElementById('lintang').value = lokasi.lintang;
        document.getElementById('bujur').value = lokasi.bujur;
        document.getElementById('jam_operasi').value = lokasi.jam_operasi || '';

        // Centang checkbox tipe bensin
        document.querySelectorAll('input[name="tipe_bensin"]').forEach(cb => cb.checked = false);
        let bbmList = lokasi.tipe_bensin;
        if (typeof bbmList === 'string') {
            try { bbmList = JSON.parse(bbmList); } catch(e) {}
        }
        if (Array.isArray(bbmList)) {
            bbmList.forEach(val => {
                const cb = document.querySelector(`input[name="tipe_bensin"][value="${val}"]`);
                if (cb) cb.checked = true;
            });
        }

        document.getElementById('formTitle').innerText = 'Edit Data Lokasi';
        document.getElementById('btnSubmit').innerText = 'Update Data';
        document.getElementById('btnBatal').style.display = 'inline-block';

        window.scrollTo(0, 0);
    }

    function resetForm() {
        document.getElementById('lokasiId').value = '';
        document.getElementById('lokasiForm').reset();

        document.getElementById('formTitle').innerText = 'Tambah Lokasi Baru';
        document.getElementById('btnSubmit').innerText = 'Simpan Data';
        document.getElementById('btnBatal').style.display = 'none';
    }

    document.getElementById('btnBatal').addEventListener('click', resetForm);

    // Jalankan pertama kali
    ambilSemuaLokasi();
</script>

</body>
</html>
